<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キャンパス青空ジム</title>
<link rel="stylesheet" href="campus.css">
</head>
<body>

<div class="sky">
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>

  <header class="top">
    <div class="badge">龍谷大学 深草キャンパス</div>
    <h1 class="title">キャンパス<br>青空ジム</h1>
    <p class="catch">その階段も、その5分も、ぜんぶジムになる。</p>
    <p class="lead">授業のあいだ、移動のついで。<br>お金も道具もいらない、キャンパスまるごと運動場。</p>
  </header>

  <main class="menu">
    <p class="menu-label">やってみたいものを選ぼう</p>

    <a href="stairs.html" class="mbtn mbtn-stairs">
      <span class="mbtn-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 32h7v-7h7v-7h7v-7h7"/>
        </svg>
      </span>
      <span class="mbtn-text">
        <span class="mbtn-title">階段でカロリー消費</span>
        <span class="mbtn-sub">1段のぼるだけで、実はこんなに</span>
      </span>
      <span class="mbtn-arrow" aria-hidden="true">→</span>
    </a>

    <a href="walk.html" class="mbtn mbtn-walk">
      <span class="mbtn-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="22" cy="8" r="3.4"/>
          <path d="M20 14l-4 8 5 4 2 7"/>
          <path d="M16 22l-6 3"/>
          <path d="M21 26l7-1"/>
          <path d="M16 33l0-7"/>
        </svg>
      </span>
      <span class="mbtn-text">
        <span class="mbtn-title">歩いてどれだけ？</span>
        <span class="mbtn-sub">徒歩◯分でこれくらい動ける</span>
      </span>
      <span class="mbtn-arrow" aria-hidden="true">→</span>
    </a>

    <a href="sukima.html" class="mbtn mbtn-training">
      <span class="mbtn-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 20h4M30 20h4"/>
          <path d="M10 14v12M30 14v12"/>
          <path d="M13 20h14"/>
        </svg>
      </span>
      <span class="mbtn-text">
        <span class="mbtn-title">すきま運動</span>
        <span class="mbtn-sub">座ったままできる筋トレ＆ストレッチ</span>
      </span>
      <span class="mbtn-arrow" aria-hidden="true">→</span>
    </a>
  </main>

  <footer class="foot">
    <p>キャンパス青空ジム</p>
    <p class="foot-note">ゼミ企画 ／ 試作版</p>
  </footer>
</div>

</body>
</html>
